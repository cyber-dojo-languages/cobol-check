# cobol-check's settings for a kata. A path of . is the kata's directory,
# which is where cyber-dojo.sh runs cobol-check from. Everything cobol-check
# generates goes under /tmp/cobol-check, outside the kata, so none of it
# appears among the learner's files.

config.loaded = production
cobolcheck.prefix = UT-
cobolcheck.injectedCodeTag.start = null
cobolcheck.injectedCodeTag.end = null
cobolcheck.stub.comment.tag = null
cobolcheck.decimalPointIsComma = false
cobolcheck.append.rules = null
cobolcheck.test.unmockcall.display = true
cobolcheck.file.encoding.linux = default
generated.files.permission.all = rx
gnucobol.compile.options = null

# The learner's programs, copybooks, and test suites. cobol-check searches
# below each directory for program X as the file X.CBL, and for its tests as
# every file in a directory named X. A kata is small, so all three are the
# kata's own directory, and the shortest layout is X.CBL beside X/XTest.cut
application.source.directory = .
application.copybook.directory = .
application.source.filename.suffix = CBL,cbl,COB,cob
application.copybook.filename.suffix = CBL,cbl,COB,cob,CPY,cpy
test.suite.directory = .

# What cobol-check generates.
cobolcheck.test.program.path = /tmp/cobol-check
cobolcheck.test.program.name = CC##99.CBL
concatenated.test.suites = /tmp/cobol-check/ALLTESTS
testsuite.parser.error.log.path = /tmp/cobol-check
testsuite.parser.error.log.name = ParserErrorLog.txt
test.results.file = /tmp/cobol-check/testResults
test.results.format = txt
test.results.format.style = directOutput

# Compiling and running each generated test program.
cobolcheck.test.run = true
cobolcheck.script.directory = /opt/cobol-check/scripts
linux.process = compile_and_run_test_program.sh
unix.process = compile_and_run_test_program.sh
